[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=%(ENV_XDG_RUNTIME_DIR)s/supervisord.pid
childlogdir=%(ENV_XDG_RUNTIME_DIR)s

[unix_http_server]
file=%(ENV_XDG_RUNTIME_DIR)s/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_XDG_RUNTIME_DIR)s/supervisor.sock

[eventlistener:fatal-exit]
command=/opt/codex-server/bin/exit-on-fatal.sh
events=PROCESS_STATE_FATAL
priority=5
autostart=true
autorestart=true
startsecs=0

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x900x24 -nolisten tcp
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:keyring]
command=/opt/codex-server/bin/start-keyring.sh
priority=20
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/opt/codex-server/bin/start-openbox.sh
priority=30
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:terminal]
command=/opt/codex-server/bin/start-terminal.sh
priority=40
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/opt/codex-server/bin/start-vnc.sh
priority=40
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=50
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:launcher]
command=/opt/codex-server/bin/start-launcher.sh
directory=/home/codex
priority=60
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
