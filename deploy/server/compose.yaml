services:
  desktop:
    platform: linux/amd64
    image: lesliechan721/codex-chatgpt-web:latest
    restart: unless-stopped
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/codex
      DISPLAY: :99
      XDG_RUNTIME_DIR: /tmp/codex-runtime
      CODEX_CHATGPT_WEB_HOME: /home/codex/.codex-chatgpt-web
      CODEX_WEB_GPT_LAUNCHER_DATA_DIR: /home/codex/.config/Codex Web GPT
      CODEX_CHATGPT_WEB_BIND_HOST: 0.0.0.0
      CODEX_CHATGPT_WEB_MANUAL_CODEX_CONFIG: "1"
      CODEX_CHATGPT_WEB_PUBLIC_BASE_URL: ${CODEX_PUBLIC_BASE_URL:-}
      CODEX_CHATGPT_WEB_CLIENT_PORT: ${RESPONSES_HOST_PORT:-17841}
      CODEX_CHATGPT_WEB_CLIENT_CATALOG_PATH: ${CODEX_CLIENT_CATALOG_PATH:-~/.codex/api-key-models.json}
      CODEX_CHATGPT_WEB_REMOTE_TURN_IDLE_TIMEOUT_SEC: ${REMOTE_TURN_IDLE_TIMEOUT_SEC:-600}
      CODEX_CHATGPT_WEB_TOOL_AUTHORITY_MODE: delegated
      APPIMAGE_EXTRACT_AND_RUN: "1"
      APPIMAGE_PATH: /opt/codex/Codex-Web-GPT.AppImage
      VNC_PASSWORD_FILE: /run/secrets/vnc_password
      KEYRING_PASSWORD_FILE: /run/secrets/keyring_password
    ports:
      - "127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080"
      - "127.0.0.1:${RESPONSES_HOST_PORT:-17841}:17841"
    volumes:
      - "${CODEX_HOME_MOUNT:-codex_home}:/home/codex"
    secrets:
      - vnc_password
      - keyring_password
    healthcheck:
      test: ["CMD", "/opt/codex-server/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  codex_home:

secrets:
  vnc_password:
    environment: VNC_PASSWORD
  keyring_password:
    environment: KEYRING_PASSWORD
