name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  codex-model-gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare locked Codex release
        run: bun run scripts/prepare-codex-release.ts
      - run: bun run generate:codex-model-metadata --check
      - run: bun run smoke:codex

  build:
    needs: codex-model-gate
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime_asset: codex-chatgpt-web-darwin-arm64.tar.gz
          - runner: ubuntu-latest
            runtime_asset: codex-chatgpt-web-linux-amd64.tar.gz
          - runner: ubuntu-24.04-arm
            runtime_asset: codex-chatgpt-web-linux-arm64.tar.gz
          - runner: windows-latest
            runtime_asset: codex-chatgpt-web-windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    env:
      CGW_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.3 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify --test-mode=timing
        if: runner.os != 'Windows'
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
          CGW_TEST_RUNNER_CLASS: ${{ matrix.runner }}
          CGW_TEST_TIMING_RESTORE: "1"
          CGW_TEST_TIMING_TOKEN: ${{ github.token }}
          CGW_TEST_TIMING_ARTIFACT_DIR: ${{ runner.temp }}/test-timing-history
      - name: Upload complete platform file timings
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.runner }}
          path: ${{ runner.temp }}/test-timing-history
          if-no-files-found: ignore
      - name: Upload test performance reports
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-release-${{ matrix.runner }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: warn
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
      - name: Verify embedded macOS runtime signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        if: runner.os == 'macOS'
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/Codex Web GPT.app"
      - name: Archive runtime
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.runtime_asset }}" -C launcher/build/runtime .
      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
            launcher/artifacts/*.exe
            launcher/artifacts/*.AppImage
          if-no-files-found: error

  intel:
    needs: codex-model-gate
    uses: ./.github/workflows/intel-release.yml

  windows-test-shard:
    name: Windows server tests (${{ matrix.shard }}/2)
    needs: codex-model-gate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    env:
      CGW_TEST_WORKERS: "2"
      CGW_TEST_RUNNER_CLASS: windows-latest
    steps:
      - name: Preserve repository source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Validate launcher installer with Windows PowerShell 5.1
        if: matrix.shard == 1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.3 -GitHubEnv $env:GITHUB_ENV
      - name: Verify non-server stages and server shard 1
        if: matrix.shard == 1
        run: bun run verify --test-mode=timing --test-shard=1/2
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Run server shard 2
        if: matrix.shard == 2
        run: bun run test --mode=timing --shard=2/2
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-windows-latest-workers-${{ env.CGW_TEST_WORKERS }}-shard-${{ matrix.shard }}-of-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: error

  windows-gate:
    name: Verify complete Windows release tests
    if: always()
    needs: [build, windows-test-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      WINDOWS_SHARDS_RESULT: ${{ needs.windows-test-shard.result }}
      CGW_TEST_WORKERS: "2"
    steps:
      - name: Preserve repository source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Select reports from effective shard attempts
        id: shard-artifacts
        if: always()
        run: bun run scripts/select-test-shard-artifacts.ts
        env:
          SHARD_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          SHARD_JOB_NAME: Windows server tests
          SHARD_PACKAGE_JOB_NAME: build (windows-latest, codex-chatgpt-web-windows-amd64.zip)
          SHARD_ARTIFACT_PREFIX: test-performance-windows-latest-workers-${{ env.CGW_TEST_WORKERS }}
          SHARD_SELECTION_PATH: ${{ runner.temp }}/windows-shard-selection.json
      - name: Check complete Windows job states
        if: always()
        env:
          WINDOWS_PACKAGE_RESULT: ${{ steps.shard-artifacts.outputs.package-result }}
        run: |
          [[ "$WINDOWS_SHARDS_RESULT" == 'success' && "$WINDOWS_PACKAGE_RESULT" == 'success' ]]
      - name: Download selected shard 1 evidence
        if: always() && steps.shard-artifacts.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.shard-artifacts.outputs.shard-1-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-shards/shard-1
      - name: Download selected shard 2 evidence
        if: always() && steps.shard-artifacts.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.shard-artifacts.outputs.shard-2-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-shards/shard-2
      - name: Verify shard provenance and complete coverage
        if: always()
        env:
          WINDOWS_PACKAGE_RESULT: ${{ steps.shard-artifacts.outputs.package-result }}
        run: |
          bun -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/windows-shard-jobs.json", JSON.stringify({shard1:process.env.WINDOWS_SHARDS_RESULT,shard2:process.env.WINDOWS_SHARDS_RESULT,package:process.env.WINDOWS_PACKAGE_RESULT}));'
          bun run scripts/aggregate-test-shards.ts "--artifacts=$RUNNER_TEMP/windows-shards" "--job-results=$RUNNER_TEMP/windows-shard-jobs.json" "--selection=$RUNNER_TEMP/windows-shard-selection.json" "--output=$RUNNER_TEMP/windows-shard-aggregate.json" --skip-policy=.github/windows-test-skips.json --mode=timing
      - name: Upload independent Windows aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shard-aggregate-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-shard-aggregate.json
            ${{ runner.temp }}/windows-shard-selection.json
          if-no-files-found: warn

  publish:
    needs: [build, windows-gate, intel]
    runs-on: ubuntu-latest
    outputs:
      image_latest: ${{ steps.release.outputs.image_latest }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.3.md release-assets/Bun-1.4.3.md
          cp LICENSES/libnotify-0.8.7-LGPL-2.1.md release-assets/libnotify-0.8.7-LGPL-2.1.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Publish GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          test "${#release_files[@]}" -gt 0
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *beta* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if existing_release="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease 2>/dev/null)"; then
            # A maintainer can stage a final-version tag as a public preview before building it.
            # Rebuilding its assets must not silently promote that release to old launchers.
            if jq -e '.isPrerelease == true' <<< "$existing_release" >/dev/null; then
              release_flags=(--prerelease --latest=false)
            else
              release_flags=(--prerelease=false --latest)
            fi
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              "${release_flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              "${release_flags[@]}" \
              --generate-notes
          fi

          published_manifest="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name != "checksums.txt") | [.name, .digest] | @tsv' \
            | while IFS=$'\t' read -r name digest; do
                if [[ "$digest" != sha256:* || -z "${digest#sha256:}" ]]; then
                  echo "Published asset has no SHA-256 digest: $name" >&2
                  exit 1
                fi
                printf '%s  %s\n' "${digest#sha256:}" "$name"
              done \
            | LC_ALL=C sort -k2 > "$published_manifest"
          test -s "$published_manifest"
          mv "$published_manifest" release-assets/checksums.txt
          gh release upload "$GITHUB_REF_NAME" release-assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          while IFS=$'\t' read -r name digest; do
            if [ "$name" = checksums.txt ]; then continue; fi
            expected="$(awk -v asset="$name" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [ -z "$expected" ] || [ "sha256:$expected" != "$digest" ]; then
              echo "Published asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv')

          local_manifest_digest="$(sha256sum release-assets/checksums.txt | awk '{ print $1 }')"
          remote_manifest_digest="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "checksums.txt") | .digest')"
          test "sha256:$local_manifest_digest" = "$remote_manifest_digest"

          image_latest="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease \
            --jq '.isPrerelease | not')"
          echo "image_latest=$image_latest" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Prepare server image tags
        id: image
        env:
          PUBLISH_LATEST: ${{ needs.publish.outputs.image_latest }}
        run: |
          version="$(jq -r .version package.json)"
          image="lesliechan721/codex-chatgpt-web"
          {
            echo 'tags<<EOF'
            echo "$image:$version"
            if [ "$PUBLISH_LATEST" = true ]; then
              echo "$image:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
