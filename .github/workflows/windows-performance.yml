name: Release test diagnostics

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Diagnostic runner"
        type: choice
        options: ["windows-latest", "macos-15-intel"]
        default: "windows-latest"
      suite:
        description: "Target files; continuity-adapter uses the historical neighboring file"
        type: choice
        options: ["continuity", "continuity-task", "continuity-adapter", "continuity-source", "cli", "all"]
        default: "continuity"
      condition:
        description: "mode-pair: full/timing at default isolation, 2 workers; requires suite=all, cold, no filter"
        type: choice
        options: ["all", "mode-pair", "original-1", "original-2", "isolated-full-1", "isolated-full-2", "isolated-timing-1", "isolated-timing-2"]
        default: "all"
      test_name_pattern:
        description: "Optional Bun test name regex; filtered runs cannot publish complete-suite history"
        type: string
        default: ""
      skip_evidence:
        description: "Optional mode-pair JSON: version 1, source identity and reviewed skip reasons"
        type: string
        default: ""
      history:
        description: "Restore requires suite=all, one condition and no filter"
        type: choice
        options: ["cold", "restore"]
        default: "cold"
      repetitions:
        description: "Retain every attempt; mode-pair uses AB/BA/AB at 3 rounds (10 only for CLI/source)"
        type: choice
        options: ["1", "2", "3", "10"]
        default: "3"
      runtime:
        description: "Actual test runtime on Windows"
        type: choice
        options: ["installed", "baseline"]
        default: "installed"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.2 -GitHubEnv $env:GITHUB_ENV
      - name: Run Windows diagnostic conditions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Runtime = if ($env:DIAGNOSTIC_RUNTIME -eq 'baseline') { $env:CODEX_CHATGPT_WEB_EMBEDDED_BUN } else { (Get-Command bun).Source }
          $SkipEvidenceArguments = @()
          if ($env:DIAGNOSTIC_CONDITION -eq 'mode-pair' -and -not [string]::IsNullOrEmpty($env:DIAGNOSTIC_SKIP_EVIDENCE)) {
            $SkipEvidencePath = Join-Path $env:RUNNER_TEMP 'mode-pair-skip-evidence.json'
            [System.IO.File]::WriteAllText($SkipEvidencePath, $env:DIAGNOSTIC_SKIP_EVIDENCE, [System.Text.UTF8Encoding]::new($false))
            $SkipEvidenceArguments += "--skip-evidence=$SkipEvidencePath"
          }
          & $Runtime run scripts/diagnose-test-performance.ts "--repetitions=$env:DIAGNOSTIC_REPETITIONS" "--suite=$env:DIAGNOSTIC_SUITE" "--condition=$env:DIAGNOSTIC_CONDITION" "--history=$env:DIAGNOSTIC_HISTORY" "--test-name-pattern=$env:DIAGNOSTIC_PATTERN" @SkipEvidenceArguments
          exit $LASTEXITCODE
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
          CGW_TEST_RUNNER_CLASS: ${{ inputs.platform }}
          CGW_TEST_TIMING_ARTIFACT_DIR: ${{ runner.temp }}/test-timing-history
          CGW_TEST_TIMING_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUNTIME: ${{ inputs.runtime }}
          DIAGNOSTIC_REPETITIONS: ${{ inputs.repetitions }}
          DIAGNOSTIC_SUITE: ${{ inputs.suite }}
          DIAGNOSTIC_CONDITION: ${{ inputs.condition }}
          DIAGNOSTIC_HISTORY: ${{ inputs.history }}
          DIAGNOSTIC_PATTERN: ${{ inputs.test_name_pattern }}
          DIAGNOSTIC_SKIP_EVIDENCE: ${{ inputs.skip_evidence }}
      - name: Run Intel diagnostic conditions
        if: runner.os == 'macOS'
        run: |
          skip_evidence_arguments=()
          if [[ "$DIAGNOSTIC_CONDITION" == 'mode-pair' && -n "$DIAGNOSTIC_SKIP_EVIDENCE" ]]; then
            skip_evidence_path="$RUNNER_TEMP/mode-pair-skip-evidence.json"
            printf '%s' "$DIAGNOSTIC_SKIP_EVIDENCE" > "$skip_evidence_path"
            skip_evidence_arguments+=("--skip-evidence=$skip_evidence_path")
          fi
          bun run scripts/diagnose-test-performance.ts "--repetitions=$DIAGNOSTIC_REPETITIONS" "--suite=$DIAGNOSTIC_SUITE" "--condition=$DIAGNOSTIC_CONDITION" "--history=$DIAGNOSTIC_HISTORY" "--test-name-pattern=$DIAGNOSTIC_PATTERN" "${skip_evidence_arguments[@]}"
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
          CGW_TEST_RUNNER_CLASS: ${{ inputs.platform }}
          CGW_TEST_TIMING_ARTIFACT_DIR: ${{ runner.temp }}/test-timing-history
          CGW_TEST_TIMING_TOKEN: ${{ github.token }}
          DIAGNOSTIC_REPETITIONS: ${{ inputs.repetitions }}
          DIAGNOSTIC_SUITE: ${{ inputs.suite }}
          DIAGNOSTIC_CONDITION: ${{ inputs.condition }}
          DIAGNOSTIC_HISTORY: ${{ inputs.history }}
          DIAGNOSTIC_PATTERN: ${{ inputs.test_name_pattern }}
          DIAGNOSTIC_SKIP_EVIDENCE: ${{ inputs.skip_evidence }}
      - name: Upload complete platform file timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ inputs.platform }}
          path: ${{ runner.temp }}/test-timing-history
          if-no-files-found: ignore
      - name: Upload every diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ inputs.platform }}-${{ inputs.runtime }}-${{ github.sha }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: warn
