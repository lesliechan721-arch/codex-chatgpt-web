name: Intel release validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-shard:
    name: Intel server tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CGW_TEST_WORKERS: "2"
      CGW_TEST_RUNNER_CLASS: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Verify non-server stages and server shard 1
        if: matrix.shard == 1
        run: bun run verify --test-mode=timing --test-shard=1/2
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Run server shard 2
        if: matrix.shard == 2
        run: bun run test --mode=timing --shard=2/2
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-macos-15-intel-workers-2-shard-${{ matrix.shard }}-of-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: error

  package:
    name: Intel package and smoke
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run app:package
      - run: bun run app:smoke
      - name: Verify embedded macOS runtime signature
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/Codex Web GPT.app"
      - name: Archive runtime
        run: tar -czf codex-chatgpt-web-darwin-amd64.tar.gz -C launcher/build/runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-15-intel
          path: |
            codex-chatgpt-web-darwin-amd64.tar.gz
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
          if-no-files-found: error

  gate:
    name: Verify complete Intel release tests
    if: always()
    needs: [test-shard, package]
    runs-on: ubuntu-latest
    env:
      INTEL_SHARDS_RESULT: ${{ needs.test-shard.result }}
      INTEL_PACKAGE_RESULT: ${{ needs.package.result }}
      CGW_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Check complete Intel job states
        run: |
          [[ "$INTEL_SHARDS_RESULT" == 'success' && "$INTEL_PACKAGE_RESULT" == 'success' ]]
      - name: Download exact shard 1 evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: test-performance-macos-15-intel-workers-2-shard-1-of-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intel-shards/shard-1
      - name: Download exact shard 2 evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: test-performance-macos-15-intel-workers-2-shard-2-of-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intel-shards/shard-2
      - name: Verify shard provenance and complete coverage
        if: always()
        run: |
          bun -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/intel-shard-jobs.json", JSON.stringify({shard1:process.env.INTEL_SHARDS_RESULT,shard2:process.env.INTEL_SHARDS_RESULT,package:process.env.INTEL_PACKAGE_RESULT}));'
          bun run scripts/aggregate-test-shards.ts "--artifacts=$RUNNER_TEMP/intel-shards" "--job-results=$RUNNER_TEMP/intel-shard-jobs.json" "--output=$RUNNER_TEMP/intel-shard-aggregate.json" --skip-policy=.github/macos-intel-test-skips.json --platform=darwin --arch=x64 --mode=timing
      - name: Upload independent Intel aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-shard-aggregate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intel-shard-aggregate.json
          if-no-files-found: warn
