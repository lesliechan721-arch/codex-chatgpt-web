name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_workers:
        description: "Server test workers (auto = 2 on all OSes; 1 = serial; 2 = parallel)"
        type: choice
        options: ["auto", "1", "2"]
        default: "auto"
      windows_test_topology:
        description: "Windows test topology (single runs the full suite in one job)"
        type: choice
        options: ["sharded", "single"]
        default: "sharded"

permissions:
  contents: read

jobs:
  codex-model-gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare locked Codex release
        run: bun run scripts/prepare-codex-release.ts
      - run: bun run generate:codex-model-metadata --check
      - run: bun run smoke:codex

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGW_TEST_WORKERS: ${{ inputs.test_workers != 'auto' && inputs.test_workers || '2' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify --test-mode=timing
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Upload test performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-${{ matrix.os }}-workers-${{ env.CGW_TEST_WORKERS }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: warn
      - run: bun run app:package
        if: runner.os != 'Windows'
        env:
          # PR packaging has no signing credentials; retain the verified ad-hoc signature.
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' && 'true' || 'false' }}
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
        if: runner.os != 'Windows'

  windows-verify:
    name: Windows full verification
    if: inputs.windows_test_topology == 'single'
    runs-on: windows-latest
    env:
      CGW_TEST_WORKERS: ${{ inputs.test_workers != 'auto' && inputs.test_workers || '2' }}
      CGW_TEST_RUNNER_CLASS: windows-latest
    steps:
      - name: Preserve repository source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Validate launcher installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.4 -GitHubEnv $env:GITHUB_ENV
      - run: bun run verify --test-mode=timing
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Upload test performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-windows-latest-workers-${{ env.CGW_TEST_WORKERS }}-full-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: warn

  windows-test-shard:
    name: Windows server tests (${{ matrix.shard }}/2)
    if: inputs.windows_test_topology != 'single'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    env:
      CGW_TEST_WORKERS: ${{ inputs.test_workers != 'auto' && inputs.test_workers || '2' }}
      CGW_TEST_RUNNER_CLASS: windows-latest
    steps:
      - name: Preserve repository source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Validate launcher installer with Windows PowerShell 5.1
        if: matrix.shard == 1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.4 -GitHubEnv $env:GITHUB_ENV
      - name: Verify non-server stages and server shard 1
        if: matrix.shard == 1
        run: bun run verify --test-mode=timing --test-shard=1/2 --shard-plan=.github/windows-test-shards.json
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Run server shard 2
        if: matrix.shard == 2
        run: bun run test --mode=timing --shard=2/2 --shard-plan=.github/windows-test-shards.json
        env:
          CGW_TEST_PROFILE_DIR: ${{ runner.temp }}/test-performance
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-windows-latest-workers-${{ env.CGW_TEST_WORKERS }}-shard-${{ matrix.shard }}-of-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-performance
          if-no-files-found: error

  windows-gate:
    name: verify (windows-latest)
    if: always()
    needs: [windows-verify, windows-test-shard, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      WINDOWS_TOPOLOGY: ${{ inputs.windows_test_topology || 'sharded' }}
      WINDOWS_FULL_RESULT: ${{ needs.windows-verify.result }}
      WINDOWS_SHARDS_RESULT: ${{ needs.windows-test-shard.result }}
      WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package.result }}
      CGW_TEST_WORKERS: ${{ inputs.test_workers != 'auto' && inputs.test_workers || '2' }}
    steps:
      - name: Preserve repository source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check complete Windows job states
        run: |
          if [[ "$WINDOWS_PACKAGE_RESULT" != 'success' ]]; then
            echo 'Windows package and smoke did not succeed.' >&2
            exit 1
          fi
          if [[ "$WINDOWS_TOPOLOGY" == 'sharded' ]]; then
            [[ "$WINDOWS_SHARDS_RESULT" == 'success' && "$WINDOWS_FULL_RESULT" == 'skipped' ]]
          else
            [[ "$WINDOWS_FULL_RESULT" == 'success' && "$WINDOWS_SHARDS_RESULT" == 'skipped' ]]
          fi
      - name: Select reports from effective shard attempts
        id: shard-artifacts
        if: always() && env.WINDOWS_TOPOLOGY == 'sharded'
        run: bun run scripts/select-test-shard-artifacts.ts
        env:
          SHARD_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          SHARD_JOB_NAME: Windows server tests
          SHARD_ARTIFACT_PREFIX: test-performance-windows-latest-workers-${{ env.CGW_TEST_WORKERS }}
          SHARD_SELECTION_PATH: ${{ runner.temp }}/windows-shard-selection.json
      - name: Download selected shard 1 evidence
        if: always() && env.WINDOWS_TOPOLOGY == 'sharded' && steps.shard-artifacts.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.shard-artifacts.outputs.shard-1-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-shards/shard-1
      - name: Download selected shard 2 evidence
        if: always() && env.WINDOWS_TOPOLOGY == 'sharded' && steps.shard-artifacts.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.shard-artifacts.outputs.shard-2-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-shards/shard-2
      - name: Verify shard provenance and complete coverage
        if: always() && env.WINDOWS_TOPOLOGY == 'sharded'
        run: |
          bun -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/windows-shard-jobs.json", JSON.stringify({shard1:process.env.WINDOWS_SHARDS_RESULT,shard2:process.env.WINDOWS_SHARDS_RESULT,package:process.env.WINDOWS_PACKAGE_RESULT}));'
          bun run scripts/aggregate-test-shards.ts "--artifacts=$RUNNER_TEMP/windows-shards" "--job-results=$RUNNER_TEMP/windows-shard-jobs.json" "--selection=$RUNNER_TEMP/windows-shard-selection.json" "--output=$RUNNER_TEMP/windows-shard-aggregate.json" --skip-policy=.github/windows-test-skips.json --shard-plan=.github/windows-test-shards.json --mode=timing
      - name: Upload independent Windows aggregate
        if: always() && env.WINDOWS_TOPOLOGY == 'sharded'
        uses: actions/upload-artifact@v4
        with:
          name: windows-shard-aggregate-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-shard-aggregate.json
            ${{ runner.temp }}/windows-shard-selection.json
          if-no-files-found: warn

  windows-package:
    name: Windows package and smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.4 -GitHubEnv $env:GITHUB_ENV
      - run: bun run app:package
      - run: bun run app:smoke
      - name: Upload Windows package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ github.sha }}
          path: |
            launcher/artifacts/*.exe
            launcher/artifacts/*.yml
            launcher/artifacts/*.yaml
            launcher/artifacts/*.json
          if-no-files-found: ignore

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
