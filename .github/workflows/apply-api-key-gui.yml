name: Apply API Key Launcher GUI patch

on:
  push:
    branches:
      - feat/standalone-api-key-mode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/api-key-gui-patch/*.part > /tmp/launcher-api-key-gui.patch
          echo "24cca190a9febebe03316d90be4578a4e0680b51ec59bb518122cad1ad150515  /tmp/launcher-api-key-gui.patch" | sha256sum -c -
          git apply --check /tmp/launcher-api-key-gui.patch
      - name: Apply patch and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/launcher-api-key-gui.patch
          node --check launcher/electron/api-access-settings.cjs
          node --check launcher/electron/api-access-ipc.cjs
          node --test launcher/tests/api-access-*.test.cjs
      - name: Commit Launcher GUI implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/api-key-gui-patch .github/workflows/apply-api-key-gui.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(launcher): add API key access settings"
          git push origin HEAD:feat/standalone-api-key-mode
